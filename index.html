<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>47都道府県 龍の旅</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#18202b}
body{display:flex;justify-content:center}
.app{width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;max-width:600px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff7ed 0%,#fff 38%,#eef6ff 100%);overflow:hidden;position:relative}
.header{padding:7px 10px 4px;text-align:center;flex:0 0 auto;z-index:5}
.title{display:inline-block;font-size:clamp(20px,5.8vw,32px);font-weight:950;line-height:1.08;letter-spacing:.01em;outline:none;padding:5px 14px 4px;border-radius:16px;background:linear-gradient(135deg,#111827,#374151);color:#fff;box-shadow:0 7px 18px rgba(17,24,39,.16),inset 0 1px 0 rgba(255,255,255,.14)}
.title:focus{box-shadow:0 0 0 3px rgba(255,138,0,.28),0 7px 18px rgba(17,24,39,.16)}
.subtitle{font-size:clamp(10px,2.9vw,14px);font-weight:750;margin-top:6px;color:#667085;letter-spacing:.02em}
.stats{display:flex;justify-content:center;gap:8px;margin-top:5px;font-size:clamp(11px,3.2vw,14px);font-weight:850}
.stats>div{padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 3px 12px rgba(31,41,55,.08);border:1px solid rgba(148,163,184,.18)}
.stats span{color:#ff7a00;font-size:1.08em}
.mapArea{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;overflow:visible;background:transparent;padding:0 4px 82px}
.mapWrap{position:relative;width:100%;aspect-ratio:1129/801;max-height:60%;background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(31,41,55,.10);overflow:hidden}
.mapImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.paintSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.prefRegion{transition:fill .12s ease;fill:transparent;stroke:none}
.prefRegion.painted{fill:#ff8a00;fill-opacity:.62;mix-blend-mode:multiply}
.hotspot{position:absolute;transform:translate(-50%,-50%);width:6.5%;height:6.5%;min-width:28px;min-height:24px;border:0;border-radius:50%;background:transparent;padding:0;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hotspot.active{background:rgba(255,138,0,.16);box-shadow:0 0 0 2px rgba(255,138,0,.42) inset,0 0 12px rgba(255,138,0,.16)}
.fx{position:fixed;inset:0;margin:auto;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);pointer-events:none;overflow:hidden;z-index:1000}
.dragonCanvas{position:absolute;width:min(920px,150vw);max-width:none;height:auto;transform:translate(-50%,-50%);pointer-events:none;display:block;filter:drop-shadow(0 5px 12px rgba(0,0,0,.28));animation:flyUp 5.9s ease-out forwards}
@keyframes flyUp{
    0%{
      opacity:0;
      transform:translate(-50%,-50%) translate(0,40px) scale(.82) rotate(0deg);
    }
    6%{
      opacity:1;
      transform:translate(-50%,-50%) translate(0,20px) scale(.95) rotate(0deg);
    }
    30%{
      opacity:1;
      transform:translate(-50%,-50%) translate(0,-22vh) scale(1) rotate(-3deg);
    }
    55%{
      opacity:1;
      transform:translate(-50%,-50%) translate(0,-48vh) scale(1.05) rotate(4deg);
    }
    75%{
      opacity:1;
      transform:translate(-50%,-50%) translate(0,-72vh) scale(1.08) rotate(-2deg);
    }
    88%{
      opacity:1;
      transform:translate(-50%,-50%) translate(0,-88vh) scale(1.1) rotate(2deg);
    }
    100%{
      opacity:0;
      transform:translate(-50%,-50%) translate(0,-108vh) scale(1.12) rotate(5deg);
    }
  });
}

const title=document.getElementById("title"),countEl=document.getElementById("count"),message=document.getElementById("message"),complete=document.getElementById("complete"),mapWrap=document.getElementById("mapWrap"),fx=document.getElementById("fx");
let painted=new Set(),coins=0,timer=null;
try{const saved=localStorage.getItem("dragonTitle");if(saved)title.textContent=saved}catch(e){}
title.addEventListener("input",()=>{try{localStorage.setItem("dragonTitle",title.textContent)}catch(e){}});
function update(){countEl.textContent=painted.size;complete.classList.toggle("show",painted.size===47);redrawPaint()}
function showMessage(t){message.textContent=t;message.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>message.classList.remove("show"),1800)}
function playDragon(button){
  const r=button.getBoundingClientRect();
  const video=document.createElement("video");
  video.src=new URL(DRAGON_VIDEO,document.baseURI).href;
  video.muted=true;
  video.defaultMuted=true;
  video.playsInline=true;
  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.preload="auto";

  const canvas=document.createElement("canvas");
  canvas.className="dragonCanvas";
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  const W=910,H=512;
  canvas.width=W; canvas.height=H;
  canvas.style.left=(r.left+r.width/2)+"px";
  canvas.style.top=(r.top+r.height/2)+"px";
  fx.appendChild(canvas);

  let raf=0,started=false,removed=false;
  const remove=()=>{
    if(removed)return;
    removed=true;
    cancelAnimationFrame(raf);
    video.pause();
    video.removeAttribute("src");
    video.load();
    canvas.remove();
  };

  const render=()=>{
    if(removed)return;
    if(video.readyState>=2){
      ctx.drawImage(video,0,0,W,H);
      const frame=ctx.getImageData(0,0,W,H);
      const d=frame.data;
      for(let i=0;i<d.length;i+=4){
        const rr=d[i],gg=d[i+1],bb=d[i+2];
        const mx=Math.max(rr,gg,bb);
        const lum=0.2126*rr+0.7152*gg+0.0722*bb;
        // 黒背景だけを透明化。龍の色はそのまま残す。
        let a=0;
        if(mx>=58) a=255;
        else if(mx>=28) a=Math.round((mx-28)/30*255);
        else a=0;
        // 黒に近い無彩色の背景をより確実に除去
        if(mx<70 && Math.abs(rr-gg)<8 && Math.abs(gg-bb)<8 && lum<62){
          a=Math.min(a,Math.max(0,Math.round((lum-22)/40*255)));
        }
        d[i+3]=a;
      }
      ctx.putImageData(frame,0,0);
    }
    if(!video.ended) raf=requestAnimationFrame(render);
  };

  video.addEventListener("ended",()=>{setTimeout(remove,120)},{once:true});
  video.addEventListener("error",()=>{
    showMessage("🐉 龍の再生に失敗しました。dragon.mp4 を確認してください");
    remove();
  },{once:true});

  const start=()=>{
    if(started)return;
    started=true;
    const p=video.play();
    if(p&&p.catch)p.catch(()=>{
      showMessage("🐉 龍を再生できませんでした");
      remove();
    });
    render();
  };
  video.addEventListener("loadeddata",start,{once:true});
  video.load();
}

document.querySelectorAll(".hotspot").forEach(btn=>{btn.addEventListener("click",()=>{const name=btn.dataset.name;if(btn.classList.contains("active")){btn.classList.remove("active");painted.delete(name);coins=Math.max(0,coins-1);update();showMessage("↩️ "+name+" を白に戻しました")}else{btn.classList.add("active");painted.add(name);coins++;update();playDragon(btn);showMessage("🐉 "+name+" から龍が空へ！✨")}})});
complete.addEventListener("click",()=>complete.classList.remove("show"));update();
</script></body></html>
