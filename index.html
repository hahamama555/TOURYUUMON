const DRAGON_VIDEO = "dragon.mp4";
const img=document.querySelector(".mapImage");img.src=MAP_IMAGE;
const title=document.getElementById("title"),countEl=document.getElementById("count"),coinsEl=document.getElementById("coins"),message=document.getElementById("message"),complete=document.getElementById("complete"),mapWrap=document.getElementById("mapWrap"),fx=document.getElementById("fx");
let painted=new Set(),coins=0,timer=null;
try{const saved=localStorage.getItem("dragonTitle");if(saved)title.textContent=saved}catch(e){}
title.addEventListener("input",()=>{try{localStorage.setItem("dragonTitle",title.textContent)}catch(e){}});
function update(){countEl.textContent=painted.size;coinsEl.textContent=coins;complete.classList.toggle("show",painted.size===47)}
function showMessage(t){message.textContent=t;message.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>message.classList.remove("show"),1800)}
function playDragon(button){
  const r=button.getBoundingClientRect(), a=mapWrap.getBoundingClientRect();
  const video=document.createElement("video");
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  video.src=DRAGON_VIDEO; video.muted=true; video.playsInline=true;
  video.setAttribute("playsinline",""); video.preload="auto";
  canvas.className="dragonVideo";
  canvas.style.left=(r.left+r.width/2-a.left)+"px";
  canvas.style.top=(r.top+r.height/2-a.top)+"px";
  fx.appendChild(canvas);
  const W=320,H=180; canvas.width=W; canvas.height=H;
  let stopped=false;
  function draw(){
    if(stopped)return;
    if(video.readyState>=2){
      ctx.drawImage(video,0,0,W,H);
      const img=ctx.getImageData(0,0,W,H), d=img.data;
      for(let i=0;i<d.length;i+=4){
        const r=d[i],g=d[i+1],b=d[i+2];
        const brightness=(r+g+b)/3;
        // 黒背景を透明化。暗い部分ほど透明にし、龍の緑色は残す。
        const edge=34, cutoff=18;
        let alpha=255;
        if(brightness<=cutoff) alpha=0;
        else if(brightness<edge) alpha=Math.round((brightness-cutoff)/(edge-cutoff)*255);
        d[i+3]=alpha;
      }
      ctx.putImageData(img,0,0);
    }
    requestAnimationFrame(draw);
  }
  video.addEventListener("loadeddata",()=>{draw();video.play().catch(()=>{})},{once:true});
  video.addEventListener("ended",()=>{stopped=true;canvas.remove();video.src="";},{once:true});
  video.addEventListener("error",()=>{stopped=true;canvas.remove();},{once:true});
  video.load();
}
document.querySelectorAll(".hotspot").forEach(btn=>{btn.addEventListener("click",()=>{const name=btn.dataset.name;if(btn.classList.contains("active")){btn.classList.remove("active");painted.delete(name);coins=Math.max(0,coins-1);update();showMessage("↩️ "+name+" を白に戻しました")}else{btn.classList.add("active");painted.add(name);coins++;update();playDragon(btn);showMessage("🐉 "+name+" から龍が空へ！✨")}})});
complete.addEventListener("click",()=>complete.classList.remove("show"));update();
